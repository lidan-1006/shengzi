<div class="nav">
    <button class="nav-btn active" onclick="switchPage(0)">✏️ 录入</button>
    <button class="nav-btn" onclick="switchPage(1)">🎯 测验</button>
    <button class="nav-btn" onclick="switchPage(2)">📚 词库</button>
    <button class="nav-btn" onclick="switchPage(3)">🎨 主题</button>
</div>

<div class="page active" id="page0">
    <div class="input-title">✏️ 写下你不认识的字吧！</div>
    <div class="input-group">
        <label>语言类型</label>
        <div class="lang-toggle">
            <button class="lang-btn active" id="btnCN" onclick="setInputLang('中文')">🀄 中文</button>
            <button class="lang-btn" id="btnEN" onclick="setInputLang('英文')">🔤 英文</button>
        </div>
    </div>
    <div class="input-group">
        <label id="wordLabel">生字</label>
        <input type="text" id="wordInput" placeholder="输入不认识的字/词">
    </div>
    <div class="input-group">
        <label id="noteLabel">拼音/注释（可选）</label>
        <input type="text" id="noteInput" class="note-input" placeholder="输入拼音或解释">
    </div>
    <button class="btn btn-success" onclick="addWord()">+ 添加到生字本</button>
    <div class="status-msg" id="inputStatus"></div>
    <div class="stats-bar" id="statsBar"></div>
</div>

<div class="page" id="page1">
    <div class="input-title">🎯 看看你认不认识这个字</div>
    <div class="quiz-lang-bar">
        <button class="quiz-lang-btn active" onclick="setQuizLang('全部')">全部</button>
        <button class="quiz-lang-btn" onclick="setQuizLang('中文')">🀄 中文</button>
        <button class="quiz-lang-btn" onclick="setQuizLang('英文')">🔤 英文</button>
    </div>
    <div class="quiz-card">
        <div class="quiz-word" id="quizWord">点击出题</div>
    </div>
    <div class="quiz-hint" id="quizHint"></div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <div class="quiz-buttons">
        <button class="btn btn-secondary" onclick="nextQuiz()">🎲 出题</button>
        <button class="btn btn-orange" onclick="showHint()">💡 提示</button>
        <button class="btn btn-success" onclick="markLearned()">😊 认识</button>
        <button class="btn btn-danger" onclick="markUnlearned()">🤔 不认识</button>
    </div>
</div>

<div class="page" id="page2">
    <div class="filter-section">
        <div class="filter-label">语言</div>
        <div class="filter-bar" id="langFilterBar">
            <button class="filter-btn active" onclick="setLangFilter('全部')">全部</button>
            <button class="filter-btn" onclick="setLangFilter('中文')">🀄 中文</button>
            <button class="filter-btn" onclick="setLangFilter('英文')">🔤 英文</button>
        </div>
    </div>
    <div class="filter-section">
        <div class="filter-label">状态</div>
        <div class="filter-bar" id="statusFilterBar">
            <button class="filter-btn active" onclick="setStatusFilter('全部')">全部</button>
            <button class="filter-btn" onclick="setStatusFilter('未学')">📖 未学</button>
            <button class="filter-btn" onclick="setStatusFilter('已学')">⭐ 已学</button>
        </div>
    </div>
    <div class="word-list" id="wordList"></div>
</div>

<div class="page" id="page3">
    <div class="input-title">🎨 选择你喜欢的背景</div>
    <div class="theme-grid" id="themeGrid"></div>
</div>

<script>
    const THEMES = [
        { name: "阳光", bg: "#FFF8E7", primary: "#FF6B6B", secondary: "#4ECDC4", accent: "#FFE66D", success: "#51CF66", danger: "#FF6B6B", purple: "#CC5DE8", blue: "#339AF0", orange: "#FF922B", text: "#2D3436", lightText: "#636E72", cardBg: "#FFFFFF" },
        { name: "海洋", bg: "#E3F2FD", primary: "#1976D2", secondary: "#00ACC1", accent: "#80DEEA", success: "#26A69A", danger: "#E53935", purple: "#5C6BC0", blue: "#1565C0", orange: "#FB8C00", text: "#1A237E", lightText: "#546E7A", cardBg: "#F1F8FF" },
        { name: "森林", bg: "#E8F5E9", primary: "#388E3C", secondary: "#66BB6A", accent: "#C5E1A5", success: "#2E7D32", danger: "#D32F2F", purple: "#7B1FA2", blue: "#0288D1", orange: "#F57C00", text: "#1B5E20", lightText: "#4E342E", cardBg: "#F1F8E9" },
        { name: "星空", bg: "#EDE7F6", primary: "#7B1FA2", secondary: "#BA68C8", accent: "#CE93D8", success: "#43A047", danger: "#E53935", purple: "#6A1B9A", blue: "#283593", orange: "#FF7043", text: "#311B92", lightText: "#5E35B1", cardBg: "#F3E5F5" },
        { name: "糖果", bg: "#FFF0F5", primary: "#EC407A", secondary: "#F48FB1", accent: "#F8BBD0", success: "#66BB6A", danger: "#E53935", purple: "#AB47BC", blue: "#42A5F5", orange: "#FFA726", text: "#880E4F", lightText: "#AD1457", cardBg: "#FFF8FA" },
    ];

    const PRAISE    = ["太棒了！你真聪明！🌟", "哇！你认识这个字！👏", "真厉害！继续加油！🎉", "你是识字小达人！⭐", "好样的！越来越棒了！🏆", "太了不起了！🎊", "你的脑瓜真灵光！💡"];
    const ENCOURAGE = ["没关系，再记一记！📖", "下次一定能认出来！💪", "慢慢来，你一定行！🌱", "多看几遍就记住啦！📝", "加油！你可以的！🌟"];

    let data = { unlearned: [], learned: [], score: 0, themeIndex: 0 };

    let currentInputLang  = "中文";
    let currentQuizLang   = "全部";
    let currentLangFilter   = "全部";
    let currentStatusFilter = "全部";
    let currentWord = null;
    let currentAudio = null;

    function saveData() {
        localStorage.setItem("shengzi_data_v2", JSON.stringify(data));
    }

    function loadData() {
        const saved = localStorage.getItem("shengzi_data_v2");
        if (saved) {
            data = JSON.parse(saved);
            data.score      = data.score      || 0;
            data.themeIndex = data.themeIndex || 0;
            [...data.unlearned, ...data.learned].forEach(w => { if (!w.lang) w.lang = "中文"; });
        }
        const oldSaved = localStorage.getItem("shengzi_data");
        if (!saved && oldSaved) {
            const old = JSON.parse(oldSaved);
            data.unlearned  = (old.unlearned || []).map(w => ({ ...w, lang: w.lang || "中文" }));
            data.learned    = (old.learned   || []).map(w => ({ ...w, lang: w.lang || "中文" }));
            data.score      = old.score      || 0;
            data.themeIndex = old.themeIndex || 0;
            saveData();
        }
    }

    function switchPage(idx) {
        document.querySelectorAll(".page").forEach((p, i) => p.classList.toggle("active", i === idx));
        document.querySelectorAll(".nav-btn").forEach((b, i) => b.classList.toggle("active", i === idx));
        if (idx === 2) renderWordList();
    }

    function applyTheme(index) {
        const t = THEMES[index];
        const r = document.documentElement;
        r.style.setProperty("--bg",         t.bg);
        r.style.setProperty("--primary",    t.primary);
        r.style.setProperty("--secondary",  t.secondary);
        r.style.setProperty("--accent",     t.accent);
        r.style.setProperty("--success",    t.success);
        r.style.setProperty("--danger",     t.danger);
        r.style.setProperty("--purple",     t.purple);
        r.style.setProperty("--blue",       t.blue);
        r.style.setProperty("--orange",     t.orange);
        r.style.setProperty("--text",       t.text);
        r.style.setProperty("--light-text", t.lightText);
        r.style.setProperty("--card-bg",    t.cardBg);
        data.themeIndex = index;
        saveData();
        renderThemeGrid();
    }

    function renderThemeGrid() {
        document.getElementById("themeGrid").innerHTML = THEMES.map((t, i) => `
            <div class="theme-card ${i === data.themeIndex ? 'selected' : ''}"
                 style="background:${t.bg}" onclick="applyTheme(${i})">
                <div class="theme-colors">
                    <span style="background:${t.primary}"></span>
                    <span style="background:${t.secondary}"></span>
                    <span style="background:${t.accent}"></span>
                    <span style="background:${t.success}"></span>
                </div>
                <div class="name" style="color:${t.text}">${t.name}</div>
            </div>
        `).join("");
    }

    function setInputLang(lang) {
        currentInputLang = lang;
        document.getElementById("btnCN").classList.toggle("active", lang === "中文");
        document.getElementById("btnEN").classList.toggle("active", lang === "英文");
        document.getElementById("wordLabel").textContent  = lang === "中文" ? "生字"             : "单词";
        document.getElementById("noteLabel").textContent  = lang === "中文" ? "拼音/注释（可选）" : "中文意思（可选）";
        document.getElementById("wordInput").placeholder  = lang === "中文" ? "输入不认识的字/词" : "Enter word or phrase";
        document.getElementById("noteInput").placeholder  = lang === "中文" ? "输入拼音或解释"    : "输入中文意思";
    }

    function addWord() {
        const wordEl = document.getElementById("wordInput");
        const noteEl = document.getElementById("noteInput");
        const word   = wordEl.value.trim();
        const note   = noteEl.value.trim();

        if (!word) {
            showInputStatus("⚠️ 请输入字/词哦！", "var(--danger)");
            return;
        }

        const exists = [...data.unlearned, ...data.learned].some(w => {
            if ((w.lang || "中文") !== currentInputLang) return false;
            if (currentInputLang === "英文") return (w.word || "").toLowerCase() === word.toLowerCase();
            return w.word === word;
        });

        if (exists) {
            showInputStatus(`⚠️ "${word}" 已经在生字本里啦`, "var(--orange)");
            return;
        }

        data.unlearned.push({ word, note, id: Date.now(), lang: currentInputLang });
        saveData();
        wordEl.value = "";
        noteEl.value = "";
        showInputStatus(`✅ 已添加 [${currentInputLang}]：${word}`, "var(--success)");
        updateStats();
    }

    function showInputStatus(msg, color) {
        const el = document.getElementById("inputStatus");
        el.textContent = msg;
        el.style.color = color;
    }

    function updateStats() {
        const cnU = data.unlearned.filter(w => w.lang === "中文").length;
        const enU = data.unlearned.filter(w => w.lang === "英文").length;
        const cnL = data.learned.filter(w => w.lang === "中文").length;
        const enL = data.learned.filter(w => w.lang === "英文").length;
        document.getElementById("statsBar").innerHTML = `
            <div class="stat-badge"><div class="num" style="color:var(--primary)">${cnU}</div><div class="label">中文待学</div></div>
            <div class="stat-badge"><div class="num" style="color:var(--blue)">${enU}</div><div class="label">英文待学</div></div>
            <div class="stat-badge"><div class="num" style="color:var(--success)">${cnL + enL}</div><div class="label">已学</div></div>
            <div class="stat-badge"><div class="num" style="color:var(--secondary)">${cnU + enU + cnL + enL}</div><div class="label">总计</div></div>
        `;
        updateScoreBar();
    }

    function updateScoreBar() {
        const stars = "⭐".repeat(Math.min(Math.floor(data.score / 50), 10));
        document.getElementById("scoreBar").textContent = `🏆 积分：${data.score}  ${stars}`;
    }

    function setQuizLang(lang) {
        currentQuizLang = lang;
        document.querySelectorAll(".quiz-lang-btn").forEach(btn => {
            const pure = btn.textContent.replace(/[🀄🔤 ]/g, "");
            btn.classList.toggle("active", pure === lang || btn.textContent.trim() === lang);
        });
    }

    function getQuizPool() {
        if (currentQuizLang === "全部") return data.unlearned;
        return data.unlearned.filter(w => w.lang === currentQuizLang);
    }

    function nextQuiz() {
        document.getElementById("quizFeedback").textContent = "";
        document.getElementById("quizHint").textContent = "";
        const pool = getQuizPool();
        if (pool.length === 0) {
            const wordEl = document.getElementById("quizWord");
            wordEl.textContent = "🎉";
            wordEl.className = "quiz-word";
            document.getElementById("quizHint").textContent =
                currentQuizLang === "全部" ? "太棒了！所有字都学会了！"
                : `${currentQuizLang}词汇全部学完了！`;
            currentWord = null;
            return;
        }
        currentWord = pool[Math.floor(Math.random() * pool.length)];
        const wordEl = document.getElementById("quizWord");
        wordEl.textContent = currentWord.word;
        wordEl.className = "quiz-word" + (currentWord.lang === "英文" ? " en" : "");
    }

    function showHint() {
        if (!currentWord) return;
        document.getElementById("quizHint").textContent = currentWord.note
            ? `💡 提示：${currentWord.note}`
            : "这个字/词没有添加注释哦";
    }

    function markLearned() {
        if (!currentWord) return;
        const idx = data.unlearned.findIndex(w => w.id === currentWord.id);
        if (idx > -1) {
            data.unlearned.splice(idx, 1);
            data.learned.push(currentWord);
            data.score += 10;
            saveData();
            updateStats();
        }
        const fb = document.getElementById("quizFeedback");
        fb.textContent = PRAISE[Math.floor(Math.random() * PRAISE.length)];
        fb.style.color = "var(--success)";
        setTimeout(nextQuiz, 1500);
    }

    function markUnlearned() {
        if (!currentWord) return;
        const fb = document.getElementById("quizFeedback");
        fb.textContent = ENCOURAGE[Math.floor(Math.random() * ENCOURAGE.length)];
        fb.style.color = "var(--blue)";
        setTimeout(nextQuiz, 1500);
    }

    function setLangFilter(lang) {
        currentLangFilter = lang;
        document.querySelectorAll("#langFilterBar .filter-btn").forEach(btn => {
            const t = btn.textContent.trim();
            btn.classList.toggle("active", t === lang || t.includes(lang));
        });
        renderWordList();
    }

    function setStatusFilter(status) {
        currentStatusFilter = status;
        document.querySelectorAll("#statusFilterBar .filter-btn").forEach(btn => {
            const t = btn.textContent.trim();
            btn.classList.toggle("active", t === status || t.includes(status));
        });
        renderWordList();
    }

    function filterByLang(arr) {
        if (currentLangFilter === "全部") return arr;
        return arr.filter(w => w.lang === currentLangFilter);
    }

    function renderWordList() {
        const list = document.getElementById("wordList");
        const unlearnedFiltered = filterByLang(data.unlearned);
        const learnedFiltered   = filterByLang(data.learned);

        const showUnlearned = currentStatusFilter === "全部" || currentStatusFilter === "未学";
        const showLearned   = currentStatusFilter === "全部" || currentStatusFilter === "已学";

        if (unlearnedFiltered.length + learnedFiltered.length === 0) {
            list.innerHTML = '<div class="empty-msg">📚 还没有生字哦，快去录入吧！</div>';
            return;
        }

        let html = "";

        if (showUnlearned) {
            if (unlearnedFiltered.length === 0) {
                if (currentStatusFilter === "未学") {
                    html += '<div class="empty-msg">📖 没有未学的字词哦！</div>';
                }
            } else {
                html += `
                    <div class="group-header unlearned">
                        📖 未学
                        <span class="group-count">${unlearnedFiltered.length} 个</span>
                    </div>
                `;
                html += unlearnedFiltered.map(item => renderWordItem(item, "未学")).join("");
            }
        }

        if (showLearned) {
            if (learnedFiltered.length === 0) {
                if (currentStatusFilter === "已学") {
                    html += '<div class="empty-msg">⭐ 还没有已学的字词哦！</div>';
                }
            } else {
                html += `
                    <div class="group-header learned">
                        ⭐ 已学
                        <span class="group-count">${learnedFiltered.length} 个</span>
                    </div>
                `;
                html += learnedFiltered.map(item => renderWordItem(item, "已学")).join("");
            }
        }

        list.innerHTML = html;
    }

    function renderWordItem(item, status) {
        const isCN    = (item.lang || "中文") === "中文";
        const langCls = isCN ? "cn" : "en";
        const langTxt = isCN ? "中" : "EN";
        const wordCls = isCN ? "word" : "word en";
        return `
            <div class="word-item">
                <div class="${wordCls}">${item.word}</div>
                <div class="note">${item.note || ""}</div>
                <span class="lang-badge ${langCls}">${langTxt}</span>
                <button class="speak-btn" onclick="speakWord(${item.id}, '${status}', this)" title="联网发音">🔊</button>
                <button class="del-btn" onclick="deleteWord(${item.id}, '${status}')">✕</button>
            </div>
        `;
    }

    function deleteWord(id, status) {
        if (status === "未学") {
            data.unlearned = data.unlearned.filter(w => w.id !== id);
        } else {
            data.learned = data.learned.filter(w => w.id !== id);
        }
        saveData();
        renderWordList();
        updateStats();
    }

    async function speakWord(id, status, btn) {
        const source = status === "未学" ? data.unlearned : data.learned;
        const item = source.find(w => w.id === id);
        if (!item || !item.word) return;

        const word = item.word.trim();
        const lang = item.lang || "中文";
        const oldText = btn ? btn.textContent : "🔊";

        if (btn) {
            btn.disabled = true;
            btn.classList.add("loading");
            btn.textContent = "...";
        }

        try {
            await playWordByNetwork(word, lang);
        } catch (err) {
            const ok = fallbackSpeak(word, lang);
            if (!ok) {
                alert("发音失败：网络语音不可用，且浏览器语音不可用");
            }
        } finally {
            if (btn) {
                btn.disabled = false;
                btn.classList.remove("loading");
                btn.textContent = oldText;
            }
        }
    }

    function getPronounceUrls(word, lang) {
        const q = encodeURIComponent(word);
        if (lang === "中文") {
            return [
                "https://fanyi.baidu.com/gettts?lan=zh&text=" + q + "&spd=3&source=web",
                "https://dict.youdao.com/dictvoice?audio=" + q + "&type=1"
            ];
        }
        return [
            "https://dict.youdao.com/dictvoice?audio=" + q + "&type=2",
            "https://fanyi.baidu.com/gettts?lan=en&text=" + q + "&spd=3&source=web"
        ];
    }

    async function playWordByNetwork(word, lang) {
        const urls = getPronounceUrls(word, lang);
        let lastErr = null;
        for (const url of urls) {
            try {
                await playAudioUrl(url);
                return;
            } catch (err) {
                lastErr = err;
            }
        }
        throw lastErr || new Error("all network tts failed");
    }

    function playAudioUrl(url) {
        return new Promise((resolve, reject) => {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            const audio = new Audio(url);
            let done = false;
            const timeout = setTimeout(() => finish(false, new Error("audio timeout")), 6000);

            function finish(success, err) {
                if (done) return;
                done = true;
                clearTimeout(timeout);
                audio.onplaying = null;
                audio.onerror = null;
                if (!success) {
                    try { audio.pause(); } catch (_) {}
                    reject(err || new Error("audio play failed"));
                    return;
                }
                currentAudio = audio;
                resolve();
            }

            audio.onplaying = () => finish(true);
            audio.onerror = () => finish(false, new Error("audio error"));

            const p = audio.play();
            if (p && typeof p.catch === "function") {
                p.catch(err => finish(false, err));
            }
        });
    }

    function fallbackSpeak(word, lang) {
        if (!("speechSynthesis" in window)) return false;
        try {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(word);
            u.lang = lang === "英文" ? "en-US" : "zh-CN";
            u.rate = 0.9;
            u.pitch = 1;
            window.speechSynthesis.speak(u);
            return true;
        } catch (_) {
            return false;
        }
    }

    loadData();
    applyTheme(data.themeIndex);
    updateStats();
    renderThemeGrid();

    document.getElementById("wordInput").addEventListener("keydown", e => {
        if (e.key === "Enter") document.getElementById("noteInput").focus();
    });
    document.getElementById("noteInput").addEventListener("keydown", e => {
        if (e.key === "Enter") addWord();
    });
</script>
